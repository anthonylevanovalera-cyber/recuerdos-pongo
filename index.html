<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Para la mejor mamá de Pongo</title>
    <link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@700&family=Playfair+Display:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary-red: #d63031;
            --soft-pink: #fff5f5;
            --gold: #d4af37;
        }

        body {
            background-color: var(--soft-pink);
            font-family: 'Playfair+Display', serif;
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            overflow-x: hidden;
        }

        .rose-corner {
            position: fixed;
            font-size: 2rem;
            z-index: 100;
        }
        .top-left { top: 10px; left: 10px; }
        .top-right { top: 10px; right: 10px; }
        .bottom-left { bottom: 10px; left: 10px; }
        .bottom-right { bottom: 10px; right: 10px; }

        .section-hero {
            height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            padding: 20px;
        }

        h1 {
            font-family: 'Dancing Script', cursive;
            color: var(--primary-red);
            font-size: 3.5rem;
            margin-bottom: 30px;
        }

        .envelope-container {
            width: 300px;
            height: 200px;
            background-color: #f0f0f0;
            position: relative;
            cursor: pointer;
            border: 2px solid #ddd;
            display: flex;
            justify-content: center;
            align-items: center;
            transition: transform 0.5s;
            box-shadow: 0 10px 20px rgba(0,0,0,0.1);
        }

        .envelope-container:hover { transform: scale(1.05); }

        .envelope-container::before {
            content: "Haz clic para abrir ✉️";
            font-family: 'Dancing Script', cursive;
            font-size: 1.5rem;
            color: #666;
        }

        .letter {
            display: none;
            background: white;
            padding: 30px;
            width: 80%;
            max-width: 500px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.15);
            margin-top: 20px;
            border-top: 5px solid var(--primary-red);
            animation: fadeIn 1s forwards;
        }

        .main-photo-highlight {
            display: none;
            padding: 50px 20px;
            text-align: center;
        }

        .photo-card {
            background: white;
            padding: 15px;
            box-shadow: 0 10px 20px rgba(0,0,0,0.1);
            transform: rotate(-2deg);
            max-width: 400px;
            margin: 0 auto;
        }

        .photo-card img {
            width: 100%;
            height: auto;
            border: 1px solid #eee;
        }

        .section-gallery {
            display: none;
            padding: 50px 20px;
            width: 100%;
            max-width: 1200px;
        }

        .gallery-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
            gap: 20px;
        }

        .gallery-item {
            background: white;
            padding: 10px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.1);
        }

        .gallery-item img { width: 100%; height: auto; }

        @keyframes fadeIn { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }

        #btn-photos {
            display: none;
            margin: 40px auto;
            padding: 15px 30px;
            background-color: var(--primary-red);
            color: white;
            border: none;
            border-radius: 25px;
            font-family: 'Playfair Display', serif;
            font-size: 1.1rem;
            cursor: pointer;
            box-shadow: 0 5px 15px rgba(214, 48, 49, 0.4);
        }
    </style>
</head>
<body>

    <div class="rose-corner top-left">🌹</div>
    <div class="rose-corner top-right">🌹</div>
    <div class="rose-corner bottom-left">🌹</div>
    <div class="rose-corner bottom-right">🌹</div>

    <section class="section-hero" id="hero">
        <h1>Para la mejor mamá de Pongo</h1>
        <div class="envelope-container" id="envelope" onclick="abrirSobre()"></div>
        
        <div class="letter" id="letter">
            <h3 style="font-family: 'Dancing Script'; color: var(--primary-red); font-size: 2rem;">Feliz Día</h3>
            <p style="line-height: 1.6; color: #333; font-style: italic;">
                "Este es un detalle distinto, para recordarte cuánto se te quiere aquí. Gracias por cuidar siempre de Ponguito y Showy con tanto amor."
            </p>
        </div>

        <button id="btn-photos" onclick="mostrarTodo()">Ver nuestros recuerdos</button>
    </section>

    <section class="main-photo-highlight" id="destacada">
        <h2 style="font-family: 'Dancing Script'; color: var(--primary-red); font-size: 2.5rem;">Nuestra foto favorita</h2>
        <div class="photo-card">
            <img src="img/1.png" alt="Foto Principal">
            <p style="font-family: 'Dancing Script'; font-size: 1.5rem; margin-top: 15px;">El comienzo de todo 🐾</p>
        </div>
    </section>

    <section class="section-gallery" id="galeria">
        <div class="gallery-grid" id="grid">
            <!-- Las fotos se cargarán aquí automáticamente -->
        </div>
        <footer style="text-align: center; margin-top: 80px; padding-bottom: 50px; color: #999; font-style: italic;">
            "Para tu amor que es mi tesoro..." <br> Con mucho cariño para Joselyn.
        </footer>
    </section>

    <!-- AUDIO CORREGIDO -->
    <audio id="musica" loop preload="auto">
        <source src="cancion.mp3" type="audio/mpeg">
    </audio>

    <script>
        const audio = document.getElementById('musica');

        function abrirSobre() {
            // Activar música
            audio.play().catch(e => console.log("El navegador bloqueó el audio inicial:", e));
            
            // Animaciones
            document.getElementById('envelope').style.display = 'none';
            document.getElementById('letter').style.display = 'block';
            document.getElementById('btn-photos').style.display = 'block';
        }

        function mostrarTodo() {
            document.getElementById('destacada').style.display = 'block';
            document.getElementById('galeria').style.display = 'block';
            
            const grid = document.getElementById('grid');
            // Cargar las 21 fotos restantes
            for(let i = 2; i <= 22; i++) {
                const item = document.createElement('div');
                item.className = 'gallery-item';
                item.innerHTML = `<img src="img/${i}.jpg" alt="Recuerdo ${i}">`;
                grid.appendChild(item);
            }
            
            window.scrollTo({
                top: document.getElementById('destacada').offsetTop,
                behavior: 'smooth'
            });
        }
    </script>
</body>
</html>
