<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Para la mejor mamá de Pongo</title>
    <link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@700&family=Playfair+Display:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary-red: #d63031;
            --soft-pink: #fff5f5;
        }

        body {
            background-color: var(--soft-pink);
            font-family: 'Playfair Display', serif;
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            overflow-x: hidden;
        }

        .rose-corner { position: fixed; font-size: 2rem; z-index: 100; }
        .top-left { top: 10px; left: 10px; }
        .top-right { top: 10px; right: 10px; }

        .section-hero {
            height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            padding: 20px;
        }

        h1 {
            font-family: 'Dancing Script', cursive;
            color: var(--primary-red);
            font-size: 3.5rem;
            margin-bottom: 30px;
        }

        .envelope-container {
            width: 280px;
            height: 180px;
            background-color: #ffffff;
            border: 2px solid #eee;
            display: flex;
            justify-content: center;
            align-items: center;
            cursor: pointer;
            box-shadow: 0 10px 20px rgba(0,0,0,0.1);
            transition: transform 0.3s;
        }
        .envelope-container:hover { transform: scale(1.05); }
        .envelope-container::after { content: "Abrir ✉️"; font-family: 'Dancing Script'; font-size: 1.8rem; color: #888; }

        .letter {
            display: none;
            background: white;
            padding: 25px;
            width: 85%;
            max-width: 450px;
            margin-top: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
            border-top: 5px solid var(--primary-red);
            animation: fadeIn 1s forwards;
        }

        .main-photo-highlight { display: none; padding: 50px 20px; text-align: center; }
        
        .photo-card {
            background: white;
            padding: 15px;
            box-shadow: 0 10px 20px rgba(0,0,0,0.1);
            max-width: 380px;
            margin: 0 auto;
            transform: rotate(-2deg);
        }

        .photo-card img { width: 100%; height: auto; display: block; }

        .section-gallery { display: none; padding: 50px 20px; max-width: 1100px; }
        .gallery-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 15px; }
        .gallery-item { background: white; padding: 8px; box-shadow: 0 5px 10px rgba(0,0,0,0.1); }
        .gallery-item img { width: 100%; height: auto; }

        #btn-photos {
            display: none;
            margin: 30px auto;
            padding: 12px 25px;
            background-color: var(--primary-red);
            color: white;
            border: none;
            border-radius: 20px;
            cursor: pointer;
            font-size: 1.1rem;
        }

        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
    </style>
</head>
<body>

    <div class="rose-corner top-left">🌹</div>
    <div class="rose-corner top-right">🌹</div>

    <section class="section-hero">
        <h1>Feliz Día de la Madre</h1>
        <div class="envelope-container" id="envelope" onclick="abrirRegalo()"></div>
        
        <div class="letter" id="letter">
            <h3 style="font-family: 'Dancing Script'; color: var(--primary-red); font-size: 1.8rem;">Para Joselyn</h3>
            <p style="line-height: 1.6; color: #444;">
                Este es un detalle especial para recordarte lo mucho que se te quiere. Gracias por ser la mejor mamá para Pongo.
            </p>
        </div>
        <button id="btn-photos" onclick="verGaleria()">Ver los recuerdos</button>
    </section>

    <section class="main-photo-highlight" id="destacada">
        <h2 style="font-family: 'Dancing Script'; color: var(--primary-red); font-size: 2.2rem;">Nuestra foto favorita</h2>
        <div class="photo-card">
            <img src="img/1.png" alt="Pongo">
            <p style="font-family: 'Dancing Script'; font-size: 1.4rem;">El comienzo de todo 🐾</p>
        </div>
    </section>

    <section class="section-gallery" id="galeria">
        <div class="gallery-grid" id="grid"></div>
        <footer style="text-align: center; margin-top: 60px; padding-bottom: 40px; color: #999; font-style: italic;">
            "Para tu amor que es mi tesoro..."
        </footer>
    </section>

    <!-- AUDIO -->
    <audio id="musica" loop>
        <source src="cancion.mp3" type="audio/mpeg">
    </audio>

    <script>
        const cancion = document.getElementById('musica');

        function abrirRegalo() {
            // Intentar reproducir música al hacer clic
            cancion.play().catch(error => console.log("Error de audio:", error));
            
            document.getElementById('envelope').style.display = 'none';
            document.getElementById('letter').style.display = 'block';
            document.getElementById('btn-photos').style.display = 'block';
        }

        function verGaleria() {
            document.getElementById('destacada').style.display = 'block';
            document.getElementById('galeria').style.display = 'block';
            
            const grid = document.getElementById('grid');
            // Cargar las fotos del 2 al 22
            for(let i = 2; i <= 22; i++) {
                const div = document.createElement('div');
                div.className = 'gallery-item';
                div.innerHTML = `<img src="img/${i}.jpg" alt="Foto ${i}">`;
                grid.appendChild(div);
            }
            
            window.scrollTo({ top: document.getElementById('destacada').offsetTop, behavior: 'smooth' });
        }
    </script>
</body>
</html>
